<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Factory Rangers</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #14110d;
    overflow: hidden;
    font-family: "Comic Sans MS", "Comic Sans", "Marker Felt", "Segoe Print", cursive, sans-serif;
    color: #fff;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #1c1812;
    touch-action: none;
  }
  #footer {
    position: fixed;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #d8c08a;
    pointer-events: none;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 2px #000;
  }
  body.touch #footer { display: none; }
  body.touch { cursor: default; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="footer">WASD / Arrows = move &nbsp;·&nbsp; Mouse = aim &nbsp;·&nbsp; Click / hold = shoot &nbsp;·&nbsp; P = pause &nbsp;·&nbsp; M = mute</div>
<script>
"use strict";
/* =========================================================================
   FACTORY RANGERS — a single-file browser game
   A big, cartoonish twin-stick shooter set inside a busy factory. Two hordes
   fight it out: the Rangers (humans) and the Goonies (monsters). Every shot
   that lands on the OTHER side flips that fellow onto YOUR side. Wipe out a
   whole horde to decide who runs the factory!
   ========================================================================= */

/* ----------------------------- Config ----------------------------------- */
const CFG = {
  WORLD_W: 2600,
  WORLD_H: 1900,
  START_PER_SIDE: 14,     // NPCs per horde at the start (plus you make 15 humans)
  PLAYER_SPEED: 3.3,
  PLAYER_FIRE_CD: 9,
  PLAYER_BULLET_SPD: 9.5,
  NPC_SPEED_MIN: 1.5,
  NPC_SPEED_MAX: 2.3,
  BULLET_LIFE: 64,
  BULLET_R: 5,
  UNIT_R: 15,
  PLAYER_R: 19,
  SHOOT_RANGE: 360,       // how far NPCs will open fire
  ENGAGE_RANGE: 230,      // NPCs try to hold around this distance
  CONVERT_IFRAMES: 55,    // grace period after switching sides (no re-flip)
};

const TEAM = { HUMAN: "human", MONSTER: "monster" };

/* Each side has its own selection of guns. Conversion is always one-hit, so the
   guns differ in flavour: number of pellets, spread, speed and fire rate. */
const GUNS = {
  human: [
    { name: "Ray Blaster", pellets: 1, spread: 0,    spd: 7.5, cd: 26 },
    { name: "Spreader",    pellets: 3, spread: 0.42, spd: 6.5, cd: 44 },
    { name: "Zap Rifle",   pellets: 1, spread: 0.06, spd: 8.5, cd: 14 },
  ],
  monster: [
    { name: "Goo Gun",     pellets: 1, spread: 0.04, spd: 6.5, cd: 28 },
    { name: "Spore Spray", pellets: 3, spread: 0.5,  spd: 5.5, cd: 48 },
    { name: "Acid Stream", pellets: 1, spread: 0.08, spd: 7.5, cd: 16 },
  ],
};

// Player's gun — a punchy rapid blaster that can hold-to-fire.
const PLAYER_GUN = { pellets: 1, spread: 0.05, spd: CFG.PLAYER_BULLET_SPD, cd: CFG.PLAYER_FIRE_CD };

const COLORS = {
  human:      "#5db4ff",   // ranger blue
  humanDark:  "#2a6fb8",
  humanBullet:"#aef0ff",
  monster:    "#7bdf4a",   // goonie green
  monsterDark:"#3f8f24",
  monsterBullet:"#c9ff7a",
  player:     "#ffd23f",   // hero gold
  playerDark: "#b8860b",
  spark:      "#ffe9a3",
  floorA:     "#2b2418",
  floorB:     "#322a1c",
  steel:      "#4a4a52",
  steelDark:  "#2f2f36",
  hazard:     "#e8b53a",
};

/* ----------------------------- Canvas ------------------------------------ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth;
  VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR);
  canvas.height = Math.floor(VH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ----------------------------- Utilities -------------------------------- */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
let _idCounter = 1;
const nextId = () => _idCounter++;

/* Deterministic per-seed jitter so doodles look hand-drawn but stay stable. */
function wobble(seed) {
  const s = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return (s - Math.floor(s)) - 0.5; // ~[-0.5, 0.5]
}

/* ----------------------------- Doodle drawing ---------------------------- */
function doodleCircle(x, y, r, color, opts = {}) {
  const seed = opts.seed != null ? opts.seed : (x * 0.7 + y * 1.3 + r);
  const jitter = opts.jitter != null ? opts.jitter : r * 0.09;
  const steps = 20;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  if (opts.fill) {
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const a = (i / steps) * TAU;
      const rr = r + wobble(seed + i * 3.3) * jitter;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = opts.fill; ctx.fill();
  }
  if (color) {
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const a = (i / steps) * TAU;
      const rr = r + wobble(seed + i * 3.3 + 17.1) * jitter;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = color; ctx.lineWidth = opts.lineWidth || 3; ctx.stroke();
  }
}

function doodleText(text, x, y, size, color, opts = {}) {
  ctx.save();
  ctx.font = `${opts.weight || "bold"} ${size}px "Comic Sans MS", "Marker Felt", cursive, sans-serif`;
  ctx.textAlign = opts.align || "center";
  ctx.textBaseline = opts.baseline || "middle";
  if (opts.shadow !== false) { ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillText(text, x + 3, y + 3); }
  if (opts.stroke) {
    ctx.lineWidth = opts.strokeWidth || 6; ctx.strokeStyle = opts.stroke;
    ctx.lineJoin = "round"; ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  ctx.restore();
}

/* ----------------------------- Audio (WebAudio beeps) -------------------- */
const Sound = {
  ctx: null, muted: false,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  blip(freq, dur, type = "square", vol = 0.05, slideTo = null) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    if (slideTo != null) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  shootHuman()  { this.blip(680, 0.07, "square", 0.035, 360); },
  shootMonster(){ this.blip(240, 0.09, "sawtooth", 0.035, 150); },
  shootPlayer() { this.blip(820, 0.06, "square", 0.045, 420); },
  convert()     { this.blip(440, 0.08, "triangle", 0.06); setTimeout(() => this.blip(660, 0.1, "triangle", 0.06), 60); },
  hitWall()     { this.blip(150, 0.05, "square", 0.03, 80); },
  win()         { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => this.blip(f, 0.22, "triangle", 0.07), i * 130)); },
  lose()        { [400, 330, 262, 196].forEach((f, i) => setTimeout(() => this.blip(f, 0.26, "sawtooth", 0.07), i * 150)); },
};

/* ----------------------------- Input ------------------------------------ */
const keys = {};
const pressed = {};
window.addEventListener("keydown", (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","Spacebar"].includes(e.key)) e.preventDefault();
  Sound.ensure();
  if (k === "m") Sound.muted = !Sound.muted;
});
window.addEventListener("keyup", (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
});
function consume(key) { if (pressed[key]) { pressed[key] = false; return true; } return false; }
function clearPressed() { for (const k in pressed) pressed[k] = false; }

// Mouse: position (screen space) + held button for aiming & firing.
const mouse = { x: VW / 2, y: VH / 2, down: false, moved: false };
canvas.addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.moved = true; });
canvas.addEventListener("mousedown", (e) => { Sound.ensure(); mouse.down = true; pressed["Enter"] = true; });
window.addEventListener("mouseup", () => { mouse.down = false; });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

/* ----------------------------- Touch (dual sticks) ----------------------- */
/* Left half of the screen drives a move stick, right half an aim+fire stick.
   Multitouch-aware: each finger keeps its own origin. */
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
const sticks = {
  move: { active: false, ox: 0, oy: 0, dx: 0, dy: 0, id: null },
  aim:  { active: false, ox: 0, oy: 0, dx: 0, dy: 0, id: null },
};
const STICK_MAX = 60;
function stickVec(s) {
  let dx = s.dx, dy = s.dy;
  const len = Math.hypot(dx, dy);
  if (len > STICK_MAX) { dx = dx / len * STICK_MAX; dy = dy / len * STICK_MAX; }
  return { x: dx, y: dy, len: Math.min(len, STICK_MAX) };
}
if (isTouch) {
  document.body.classList.add("touch");
  const handleStart = (e) => {
    Sound.ensure();
    for (const t of e.changedTouches) {
      // taps anywhere advance title / game-over screens
      if (state === STATE.TITLE || state === STATE.OVER) { pressed["Enter"] = true; continue; }
      const s = t.clientX < VW / 2 ? sticks.move : sticks.aim;
      if (s.active) continue;
      s.active = true; s.id = t.identifier; s.ox = t.clientX; s.oy = t.clientY; s.dx = 0; s.dy = 0;
    }
    e.preventDefault();
  };
  const handleMove = (e) => {
    for (const t of e.changedTouches) {
      for (const key of ["move", "aim"]) {
        const s = sticks[key];
        if (s.active && s.id === t.identifier) { s.dx = t.clientX - s.ox; s.dy = t.clientY - s.oy; }
      }
    }
    e.preventDefault();
  };
  const handleEnd = (e) => {
    for (const t of e.changedTouches) {
      for (const key of ["move", "aim"]) {
        const s = sticks[key];
        if (s.active && s.id === t.identifier) { s.active = false; s.id = null; s.dx = 0; s.dy = 0; }
      }
    }
    e.preventDefault();
  };
  canvas.addEventListener("touchstart", handleStart, { passive: false });
  canvas.addEventListener("touchmove", handleMove, { passive: false });
  canvas.addEventListener("touchend", handleEnd, { passive: false });
  canvas.addEventListener("touchcancel", handleEnd, { passive: false });
}

/* ----------------------------- Game state -------------------------------- */
const STATE = { TITLE: "title", PLAY: "play", PAUSE: "pause", OVER: "over" };
let state = STATE.TITLE;
let frame = 0;
let screenShake = 0;
let result = null;         // { winner, msg, sub }
let confetti = [];

const game = {
  player: null,
  units: [],
  bullets: [],
  particles: [],
  floats: [],
  obstacles: [],
  conveyors: [],
  cam: { x: 0, y: 0 },
};

/* ----------------------------- Build the factory ------------------------- */
function buildFactory() {
  game.obstacles = [];
  game.conveyors = [];
  const W = CFG.WORLD_W, H = CFG.WORLD_H;

  // Decorative conveyor belts (don't block — just factory flavour).
  for (let i = 0; i < 5; i++) {
    const horiz = Math.random() < 0.5;
    if (horiz) game.conveyors.push({ x: rand(200, W - 700), y: rand(150, H - 150), w: rand(360, 600), h: 64, horiz: true, dir: Math.random() < 0.5 ? 1 : -1 });
    else       game.conveyors.push({ x: rand(150, W - 150), y: rand(200, H - 700), w: 64, h: rand(360, 600), horiz: false, dir: Math.random() < 0.5 ? 1 : -1 });
  }

  // Solid machines & crates that block movement and bullets.
  const cx = W / 2, cy = H / 2;
  let tries = 0;
  while (game.obstacles.length < 18 && tries < 800) {
    tries++;
    const big = Math.random() < 0.4;
    const w = big ? rand(150, 240) : rand(70, 120);
    const h = big ? rand(110, 200) : rand(70, 120);
    const x = rand(120, W - 120 - w);
    const y = rand(120, H - 120 - h);
    // keep a clear arena around the central spawn
    if (x < cx + 320 && x + w > cx - 320 && y < cy + 260 && y + h > cy - 260) continue;
    let ok = true;
    for (const o of game.obstacles) {
      if (x < o.x + o.w + 70 && x + w + 70 > o.x && y < o.y + o.h + 70 && y + h + 70 > o.y) { ok = false; break; }
    }
    if (!ok) continue;
    game.obstacles.push({ x, y, w, h, kind: big ? "machine" : "crate", seed: rand(0, 100), gear: rand(0, TAU) });
  }
}

/* ----------------------------- Units ------------------------------------- */
function makeUnit(team, x, y) {
  const gunIdx = randInt(0, GUNS[team].length - 1);
  return {
    id: nextId(), team, x, y, vx: 0, vy: 0,
    r: CFG.UNIT_R,
    gunIdx,
    fireCd: randInt(0, 60),
    iframes: 0,
    seed: rand(0, 100),
    hue: rand(-1, 1),
    aim: rand(0, TAU),
    wander: rand(0, TAU),
    wanderT: randInt(30, 120),
    eyes: randInt(1, 3),
    bob: rand(0, TAU),
  };
}

function spawnHordes() {
  game.units = [];
  const W = CFG.WORLD_W, H = CFG.WORLD_H;
  const N = CFG.START_PER_SIDE;
  // Humans cluster on the left third, monsters on the right third.
  for (let i = 0; i < N; i++) {
    let x, y, t = 0;
    do { x = rand(120, W * 0.36); y = rand(120, H - 120); t++; } while (overlapsObstacle(x, y, 40) && t < 30);
    game.units.push(makeUnit(TEAM.HUMAN, x, y));
  }
  for (let i = 0; i < N; i++) {
    let x, y, t = 0;
    do { x = rand(W * 0.64, W - 120); y = rand(120, H - 120); t++; } while (overlapsObstacle(x, y, 40) && t < 30);
    game.units.push(makeUnit(TEAM.MONSTER, x, y));
  }
}

function startGame() {
  _idCounter = 1;
  frame = 0; screenShake = 0; result = null; confetti = [];
  game.bullets = []; game.particles = []; game.floats = [];
  buildFactory();
  spawnHordes();
  game.player = {
    x: CFG.WORLD_W / 2, y: CFG.WORLD_H / 2, vx: 0, vy: 0,
    r: CFG.PLAYER_R, team: TEAM.HUMAN,
    aim: -Math.PI / 2, fireCd: 0, iframes: 90, step: 0, bob: 0,
  };
  game.cam.x = game.player.x; game.cam.y = game.player.y;
  game.lastEventFrame = 0;     // frame of the last conversion (for anti-stalemate)
  state = STATE.PLAY;
  clearPressed();
}

/* ----------------------------- Obstacle helpers -------------------------- */
function overlapsObstacle(x, y, pad) {
  for (const o of game.obstacles) {
    if (x > o.x - pad && x < o.x + o.w + pad && y > o.y - pad && y < o.y + o.h + pad) return true;
  }
  return false;
}
// Push a circular entity out of any rectangle it overlaps.
function resolveObstacles(ent) {
  const r = ent.r;
  for (const o of game.obstacles) {
    const nx = clamp(ent.x, o.x, o.x + o.w);
    const ny = clamp(ent.y, o.y, o.y + o.h);
    const dx = ent.x - nx, dy = ent.y - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 < r * r) {
      const d = Math.sqrt(d2) || 0.0001;
      const push = (r - d);
      if (d2 > 0.0001) { ent.x += (dx / d) * push; ent.y += (dy / d) * push; }
      else { ent.x = o.x - r; } // dead-centre fallback
    }
  }
  // keep inside the factory walls
  ent.x = clamp(ent.x, ent.r + 24, CFG.WORLD_W - ent.r - 24);
  ent.y = clamp(ent.y, ent.r + 24, CFG.WORLD_H - ent.r - 24);
}
function bulletHitsObstacle(b) {
  for (const o of game.obstacles) {
    if (b.x > o.x && b.x < o.x + o.w && b.y > o.y && b.y < o.y + o.h) return true;
  }
  return false;
}

/* ----------------------------- Shooting ---------------------------------- */
function fireGun(shooter, team, gun, aim, isPlayer) {
  const color = team === TEAM.HUMAN ? COLORS.humanBullet : COLORS.monsterBullet;
  const base = aim - (gun.spread * (gun.pellets - 1)) / 2;
  for (let i = 0; i < gun.pellets; i++) {
    const a = (gun.pellets === 1) ? aim + (Math.random() - 0.5) * gun.spread : base + i * gun.spread;
    const sp = gun.spd * (isPlayer ? 1 : 1) * rand(0.95, 1.05);
    const mx = shooter.x + Math.cos(a) * (shooter.r + 6);
    const my = shooter.y + Math.sin(a) * (shooter.r + 6);
    game.bullets.push({
      x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      team, color, life: CFG.BULLET_LIFE, r: CFG.BULLET_R,
      power: isPlayer ? 1.6 : 1,
    });
  }
  // muzzle flash
  game.particles.push({ x: shooter.x + Math.cos(aim) * shooter.r, y: shooter.y + Math.sin(aim) * shooter.r, vx: 0, vy: 0, life: 5, max: 5, color: COLORS.spark, r: 7, flash: true });
  if (isPlayer) Sound.shootPlayer();
  else team === TEAM.HUMAN ? Sound.shootHuman() : Sound.shootMonster();
}

/* ----------------------------- Conversion -------------------------------- */
function convertUnit(u, toTeam, byX, byY) {
  u.team = toTeam;
  u.iframes = CFG.CONVERT_IFRAMES;
  game.lastEventFrame = frame;
  u.gunIdx = randInt(0, GUNS[toTeam].length - 1);
  u.fireCd = randInt(10, 30);
  const col = toTeam === TEAM.HUMAN ? COLORS.human : COLORS.monster;
  burst(u.x, u.y, col, 16, 5.5);
  burst(u.x, u.y, "#fff", 6, 4);
  // a little pop of smiley/angry emoji feedback near the player
  if (dist2(u.x, u.y, game.player.x, game.player.y) < 700 * 700)
    floatText(u.x, u.y - u.r - 6, toTeam === TEAM.HUMAN ? "Recruited! 🦸" : "Mutated! 👹", col);
  Sound.convert();
}

function convertPlayer(toTeam) {
  const p = game.player;
  p.team = toTeam;
  p.iframes = 90;
  game.lastEventFrame = frame;
  const col = toTeam === TEAM.HUMAN ? COLORS.human : COLORS.monster;
  burst(p.x, p.y, col, 28, 7);
  screenShake = 14;
  floatText(p.x, p.y - p.r - 10, toTeam === TEAM.HUMAN ? "You're a Ranger! 🦸" : "Zapped! You're a Goonie! 👹", col);
  Sound.convert();
}

/* ----------------------------- Particles / floats ------------------------ */
function burst(x, y, color, n = 10, spd = 4) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(0.5, spd);
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: randInt(16, 32), max: 32, color, r: rand(2, 5) });
  }
}
function floatText(x, y, text, color) { game.floats.push({ x, y, text, color, life: 60, max: 60 }); }

/* ----------------------------- Team census ------------------------------- */
function census() {
  let h = 0, m = 0;
  for (const u of game.units) (u.team === TEAM.HUMAN ? h++ : m++);
  if (game.player) (game.player.team === TEAM.HUMAN ? h++ : m++);
  return { h, m };
}

function checkWin() {
  const { h, m } = census();
  if (m === 0) endGame(TEAM.HUMAN);
  else if (h === 0) endGame(TEAM.MONSTER);
}

function endGame(winner) {
  const playerWith = game.player.team === winner;
  if (winner === TEAM.HUMAN) {
    result = { winner, msg: "RANGERS WIN! 🎉", sub: playerWith ? "You held the line — the factory is safe!" : "Your old team pulled through without you!" };
    confetti = makeConfetti();
    Sound.win();
  } else {
    result = { winner, msg: "GOONIES WIN! 👹", sub: playerWith ? "You went full monster... and took over!" : "The monsters overran the factory. Try again!" };
    Sound.lose();
  }
  state = STATE.OVER;
  clearPressed();
}

function makeConfetti() {
  const cols = ["#ff6b6b", "#ffd23f", "#7bff9b", "#5d9bff", "#ff7bc6", "#9b6bff", "#4dd2ff"];
  const bits = [];
  for (let i = 0; i < 110; i++) bits.push({ x: rand(0, VW), y: rand(-VH, 0), vy: rand(1.5, 4.5), vx: rand(-0.8, 0.8), w: rand(6, 12), h: rand(8, 16), color: pick(cols), rot: rand(0, TAU), rotV: rand(-0.2, 0.2) });
  return bits;
}

/* ----------------------------- Targeting --------------------------------- */
// Nearest enemy of `team` to (x,y); considers both NPCs and the player.
function nearestEnemy(x, y, team, exclude) {
  let best = null, bd = Infinity;
  for (const u of game.units) {
    if (u === exclude || u.team === team) continue;
    const d = dist2(x, y, u.x, u.y);
    if (d < bd) { bd = d; best = u; }
  }
  const p = game.player;
  if (p && p.team !== team) {
    const d = dist2(x, y, p.x, p.y);
    if (d < bd) { bd = d; best = p; }
  }
  return { target: best, d2: bd };
}

/* ----------------------------- Update: player ---------------------------- */
function updatePlayer() {
  const p = game.player;
  // movement
  let mx = 0, my = 0;
  if (keys["a"] || keys["ArrowLeft"]) mx -= 1;
  if (keys["d"] || keys["ArrowRight"]) mx += 1;
  if (keys["w"] || keys["ArrowUp"]) my -= 1;
  if (keys["s"] || keys["ArrowDown"]) my += 1;
  if (sticks.move.active) { const v = stickVec(sticks.move); if (v.len > 8) { mx = v.x; my = v.y; } }
  const mlen = Math.hypot(mx, my);
  if (mlen > 0.01) { mx /= mlen; my /= mlen; }
  const sp = CFG.PLAYER_SPEED;
  p.vx = lerp(p.vx, mx * sp, 0.3);
  p.vy = lerp(p.vy, my * sp, 0.3);
  p.x += p.vx; p.y += p.vy;
  resolveObstacles(p);
  if (mlen > 0.01) p.step += 0.3; else p.step = 0;
  p.bob += 0.15;

  // aim
  let firing = false;
  if (sticks.aim.active) {
    const v = stickVec(sticks.aim);
    if (v.len > 12) { p.aim = Math.atan2(v.y, v.x); firing = true; }
  } else {
    const wmx = mouse.x - (VW / 2 - game.cam.x);
    const wmy = mouse.y - (VH / 2 - game.cam.y);
    p.aim = Math.atan2(wmy - p.y, wmx - p.x);
    firing = mouse.down || keys[" "];
  }

  // shoot
  if (p.fireCd > 0) p.fireCd--;
  if (firing && p.fireCd <= 0) {
    fireGun(p, p.team, PLAYER_GUN, p.aim, true);
    p.fireCd = PLAYER_GUN.cd;
  }
  if (p.iframes > 0) p.iframes--;
}

/* ----------------------------- Update: NPC ------------------------------- */
function updateUnit(u) {
  if (u.iframes > 0) u.iframes--;
  u.bob += 0.12;
  const { target, d2 } = nearestEnemy(u.x, u.y, u.team, u);

  let desVx = 0, desVy = 0;
  const speed = lerp(CFG.NPC_SPEED_MIN, CFG.NPC_SPEED_MAX, (u.seed % 10) / 10);

  if (target) {
    const dx = target.x - u.x, dy = target.y - u.y;
    const d = Math.sqrt(d2) || 1;
    u.aim = Math.atan2(dy, dx);
    // hold around engage range: approach if far, back off if too close.
    // but if the battle has stalled (nobody flipped in a while), everyone
    // charges to point-blank so blocked shots finally connect — a final rush.
    const ux = dx / d, uy = dy / d;
    // If the battle stalls (often two clusters stuck either side of a machine),
    // pull everyone toward the open central arena where shots connect cleanly.
    const stale = (frame - (game.lastEventFrame || 0)) > 600;
    if (stale) {
      const cdx = CFG.WORLD_W / 2 - u.x, cdy = CFG.WORLD_H / 2 - u.y;
      const cl = Math.hypot(cdx, cdy) || 1;
      desVx = cdx / cl; desVy = cdy / cl;
    }
    else if (d > CFG.ENGAGE_RANGE + 40) { desVx = ux; desVy = uy; }
    else if (d < CFG.ENGAGE_RANGE - 70) { desVx = -ux; desVy = -uy; }
    else { // strafe sideways, drifting slowly inward so they round corners
      const s = (u.id % 2 === 0) ? 1 : -1;
      desVx = -uy * s * 0.8 + ux * 0.22; desVy = ux * s * 0.8 + uy * 0.22;
    }
    // fire
    if (u.fireCd > 0) u.fireCd--;
    if (d < CFG.SHOOT_RANGE && u.fireCd <= 0) {
      const gun = GUNS[u.team][u.gunIdx];
      fireGun(u, u.team, gun, u.aim + rand(-0.08, 0.08), false);
      u.fireCd = gun.cd + randInt(0, 18);
    }
  } else {
    // no enemies in sight — gentle wander
    u.wanderT--;
    if (u.wanderT <= 0) { u.wander = rand(0, TAU); u.wanderT = randInt(40, 120); }
    desVx = Math.cos(u.wander) * 0.4; desVy = Math.sin(u.wander) * 0.4;
  }

  // separation from same-team neighbours so they don't pile up
  let sepX = 0, sepY = 0;
  for (const o of game.units) {
    if (o === u) continue;
    const dd = dist2(u.x, u.y, o.x, o.y);
    if (dd < 46 * 46 && dd > 0.01) {
      const d = Math.sqrt(dd);
      sepX += (u.x - o.x) / d; sepY += (u.y - o.y) / d;
    }
  }
  desVx += sepX * 0.5; desVy += sepY * 0.5;

  const dl = Math.hypot(desVx, desVy);
  if (dl > 0.01) { desVx = desVx / dl * speed; desVy = desVy / dl * speed; }
  u.vx = lerp(u.vx, desVx, 0.12);
  u.vy = lerp(u.vy, desVy, 0.12);
  u.x += u.vx; u.y += u.vy;
  resolveObstacles(u);
}

/* ----------------------------- Update: bullets --------------------------- */
function updateBullets() {
  const p = game.player;
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0) { game.bullets.splice(i, 1); continue; }
    if (b.x < 16 || b.x > CFG.WORLD_W - 16 || b.y < 16 || b.y > CFG.WORLD_H - 16) { game.bullets.splice(i, 1); continue; }
    if (bulletHitsObstacle(b)) { burst(b.x, b.y, "#cfcfd6", 4, 2.5); Sound.hitWall(); game.bullets.splice(i, 1); continue; }

    // hit an enemy unit?
    let hit = false;
    for (const u of game.units) {
      if (u.team === b.team || u.iframes > 0) continue;
      const rr = u.r + b.r;
      if (dist2(b.x, b.y, u.x, u.y) < rr * rr) {
        convertUnit(u, b.team, b.x, b.y);
        hit = true; break;
      }
    }
    if (hit) { game.bullets.splice(i, 1); continue; }

    // hit the player?
    if (p.team !== b.team && p.iframes <= 0) {
      const rr = p.r + b.r;
      if (dist2(b.x, b.y, p.x, p.y) < rr * rr) {
        convertPlayer(b.team);
        game.bullets.splice(i, 1); continue;
      }
    }
  }
}

/* ----------------------------- Update: effects --------------------------- */
function updateEffects() {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const pt = game.particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.92; pt.vy *= 0.92; pt.life--;
    if (pt.life <= 0) game.particles.splice(i, 1);
  }
  for (let i = game.floats.length - 1; i >= 0; i--) {
    const f = game.floats[i]; f.y -= 0.6; f.life--;
    if (f.life <= 0) game.floats.splice(i, 1);
  }
  if (screenShake > 0) screenShake *= 0.86;
}

/* ----------------------------- Update: PLAY ------------------------------ */
function updatePlay() {
  if (consume("p")) { state = STATE.PAUSE; return; }
  updatePlayer();
  for (const u of game.units) updateUnit(u);
  updateBullets();
  updateEffects();
  // camera follows the player, clamped to the world
  const halfW = VW / 2, halfH = VH / 2;
  game.cam.x = clamp(game.player.x, halfW, CFG.WORLD_W - halfW);
  game.cam.y = clamp(game.player.y, halfH, CFG.WORLD_H - halfH);
  if (CFG.WORLD_W < VW) game.cam.x = CFG.WORLD_W / 2;
  if (CFG.WORLD_H < VH) game.cam.y = CFG.WORLD_H / 2;
  checkWin();
}

function drawFloor(ox, oy) {
  // base
  ctx.fillStyle = COLORS.floorA;
  ctx.fillRect(0, 0, CFG.WORLD_W, CFG.WORLD_H);
  // tile grid (only what's roughly on screen for speed)
  const tile = 130;
  const startX = Math.floor((game.cam.x - VW / 2) / tile) * tile;
  const startY = Math.floor((game.cam.y - VH / 2) / tile) * tile;
  const endX = game.cam.x + VW / 2 + tile;
  const endY = game.cam.y + VH / 2 + tile;
  for (let x = startX; x < endX; x += tile) {
    for (let y = startY; y < endY; y += tile) {
      if (((Math.floor(x / tile) + Math.floor(y / tile)) & 1) === 0) {
        ctx.fillStyle = COLORS.floorB;
        ctx.fillRect(x, y, tile, tile);
      }
    }
  }
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = startX; x < endX; x += tile) { ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
  for (let y = startY; y < endY; y += tile) { ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
  ctx.stroke();
}

function drawConveyors() {
  for (const c of game.conveyors) {
    ctx.fillStyle = "#23201a";
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = "#15130f"; ctx.lineWidth = 4;
    ctx.strokeRect(c.x, c.y, c.w, c.h);
    // moving slats (clipped to the belt so they never spill out)
    ctx.save();
    ctx.beginPath(); ctx.rect(c.x, c.y, c.w, c.h); ctx.clip();
    ctx.fillStyle = "rgba(255,210,80,0.16)";
    const off = (((frame * 1.4 * c.dir) % 36) + 36) % 36;
    if (c.horiz) {
      for (let x = c.x - 36 + off; x < c.x + c.w; x += 36) ctx.fillRect(x, c.y + 6, 14, c.h - 12);
    } else {
      for (let y = c.y - 36 + off; y < c.y + c.h; y += 36) ctx.fillRect(c.x + 6, y, c.w - 12, 14);
    }
    ctx.restore();
  }
}

function drawObstacles() {
  for (const o of game.obstacles) {
    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(o.x + 6, o.y + 8, o.w, o.h);
    if (o.kind === "crate") {
      ctx.fillStyle = "#8a6a36";
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = "#5c4521"; ctx.lineWidth = 5;
      ctx.strokeRect(o.x, o.y, o.w, o.h);
      ctx.beginPath();
      ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + o.w, o.y + o.h);
      ctx.moveTo(o.x + o.w, o.y); ctx.lineTo(o.x, o.y + o.h);
      ctx.stroke();
    } else {
      // machine
      ctx.fillStyle = COLORS.steel;
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = COLORS.steelDark; ctx.lineWidth = 6;
      ctx.strokeRect(o.x, o.y, o.w, o.h);
      // hazard stripe along the top
      ctx.save();
      ctx.beginPath(); ctx.rect(o.x, o.y, o.w, 18); ctx.clip();
      for (let i = -o.h; i < o.w + 18; i += 22) {
        ctx.fillStyle = ((i / 22) & 1) ? COLORS.hazard : "#1a1a1f";
        ctx.beginPath();
        ctx.moveTo(o.x + i, o.y); ctx.lineTo(o.x + i + 11, o.y);
        ctx.lineTo(o.x + i + 11 + 18, o.y + 18); ctx.lineTo(o.x + i + 18, o.y + 18);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      // a spinning gear
      const gx = o.x + o.w / 2, gy = o.y + o.h / 2 + 6, gr = Math.min(o.w, o.h) * 0.26;
      drawGear(gx, gy, gr, o.gear + frame * 0.02);
      // blinky light
      const lit = (Math.sin(frame * 0.08 + o.seed) > 0);
      ctx.fillStyle = lit ? "#ff5d5d" : "#5a2020";
      ctx.beginPath(); ctx.arc(o.x + o.w - 14, o.y + o.h - 14, 6, 0, TAU); ctx.fill();
    }
  }
}

function drawGear(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = "#6d6d77";
  const teeth = 8;
  ctx.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a0 = (i / teeth) * TAU, a1 = ((i + 0.5) / teeth) * TAU;
    ctx.lineTo(Math.cos(a0) * r * 1.25, Math.sin(a0) * r * 1.25);
    ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
  }
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.95, 0, TAU); ctx.fillStyle = "#86868f"; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.34, 0, TAU); ctx.fillStyle = "#3a3a40"; ctx.fill();
  ctx.restore();
}

function drawShadow(x, y, r) {
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.7, r * 0.95, r * 0.45, 0, 0, TAU); ctx.fill();
}

/* ---- a little ranger person ---- */
function drawHuman(x, y, r, u, isPlayer) {
  const t = u.bob || 0;
  const bob = Math.sin(t) * 1.5;
  const main = isPlayer ? COLORS.player : COLORS.human;
  const dark = isPlayer ? COLORS.playerDark : COLORS.humanDark;
  drawShadow(x, y, r);
  // legs
  ctx.strokeStyle = "#2a2030"; ctx.lineWidth = Math.max(3, r * 0.22); ctx.lineCap = "round";
  const stride = Math.sin((u.step || t) * 1.0) * r * 0.35;
  ctx.beginPath(); ctx.moveTo(x - r * 0.3, y + r * 0.5); ctx.lineTo(x - r * 0.3 + stride, y + r * 0.95); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + r * 0.3, y + r * 0.5); ctx.lineTo(x + r * 0.3 - stride, y + r * 0.95); ctx.stroke();
  // body (jumpsuit)
  doodleCircle(x, y + bob, r * 0.92, dark, { fill: main, lineWidth: Math.max(2, r * 0.16), seed: u.seed });
  // chest badge
  ctx.fillStyle = isPlayer ? "#fff" : "#dff1ff";
  drawStar(x, y + bob, r * 0.28, 5);
  // helmet dome
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.arc(x, y - r * 0.5 + bob, r * 0.62, Math.PI, TAU); ctx.fill();
  // visor
  ctx.fillStyle = "#bfeaff";
  ctx.beginPath(); ctx.ellipse(x, y - r * 0.42 + bob, r * 0.46, r * 0.24, 0, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.stroke();
  // gun arm pointing at aim
  drawGunArm(x, y + bob, r, u.aim, isPlayer ? "#fff" : "#cfe8ff", dark);
  if (isPlayer) {
    // hero ring
    ctx.strokeStyle = "rgba(255,210,63,0.7)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r * 1.35, 0, TAU); ctx.stroke();
  }
}

/* ---- a goonie monster ---- */
function drawMonster(x, y, r, u, isPlayer) {
  const t = u.bob || 0;
  const squish = 1 + Math.sin(t) * 0.06;
  const main = isPlayer ? "#b8e86a" : COLORS.monster;
  const dark = COLORS.monsterDark;
  drawShadow(x, y, r);
  // little legs
  ctx.strokeStyle = dark; ctx.lineWidth = Math.max(3, r * 0.2); ctx.lineCap = "round";
  const stride = Math.sin((u.step || t)) * r * 0.3;
  ctx.beginPath(); ctx.moveTo(x - r * 0.4, y + r * 0.55); ctx.lineTo(x - r * 0.45 + stride, y + r * 0.95); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + r * 0.4, y + r * 0.55); ctx.lineTo(x + r * 0.45 - stride, y + r * 0.95); ctx.stroke();
  // blobby body
  ctx.save();
  ctx.translate(x, y); ctx.scale(1 / squish, squish); ctx.translate(-x, -y);
  doodleCircle(x, y, r * 0.98, dark, { fill: main, lineWidth: Math.max(2, r * 0.16), seed: u.seed, jitter: r * 0.16 });
  ctx.restore();
  // spikes
  ctx.fillStyle = dark;
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI * 0.85 + i * 0.5;
    const sx = x + Math.cos(a) * r * 0.85, sy = y + Math.sin(a) * r * 0.85;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(a) * 9, sy + Math.sin(a) * 9 - 3);
    ctx.lineTo(sx + Math.cos(a + 0.4) * 5, sy + Math.sin(a + 0.4) * 5);
    ctx.closePath(); ctx.fill();
  }
  // eyes
  const eyes = u.eyes || 1;
  ctx.fillStyle = "#fff";
  for (let i = 0; i < eyes; i++) {
    const ex = x + (i - (eyes - 1) / 2) * r * 0.5;
    const ey = y - r * 0.15;
    const er = r * 0.26;
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a1a";
    const look = Math.atan2(Math.sin(u.aim), Math.cos(u.aim));
    ctx.beginPath(); ctx.arc(ex + Math.cos(look) * er * 0.4, ey + Math.sin(look) * er * 0.4, er * 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#fff";
  }
  // jagged mouth
  ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = Math.max(2, r * 0.1); ctx.lineCap = "round";
  ctx.beginPath();
  const my = y + r * 0.42;
  ctx.moveTo(x - r * 0.4, my);
  ctx.lineTo(x - r * 0.18, my + r * 0.18);
  ctx.lineTo(x + r * 0.04, my);
  ctx.lineTo(x + r * 0.26, my + r * 0.18);
  ctx.lineTo(x + r * 0.42, my);
  ctx.stroke();
  drawGunArm(x, y, r, u.aim, "#dfffac", dark);
  if (isPlayer) {
    ctx.strokeStyle = "rgba(123,223,74,0.7)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r * 1.35, 0, TAU); ctx.stroke();
  }
}

function drawGunArm(x, y, r, aim, armColor, barrelColor) {
  const hx = x + Math.cos(aim) * r * 0.9, hy = y + Math.sin(aim) * r * 0.9;
  ctx.strokeStyle = armColor; ctx.lineWidth = Math.max(3, r * 0.2); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.1); ctx.lineTo(hx, hy); ctx.stroke();
  // barrel
  ctx.strokeStyle = barrelColor; ctx.lineWidth = Math.max(4, r * 0.28);
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx + Math.cos(aim) * r * 0.7, hy + Math.sin(aim) * r * 0.7);
  ctx.stroke();
}

function drawStar(x, y, r, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = (i / (points * 2)) * TAU - Math.PI / 2;
    const rr = (i & 1) ? r * 0.45 : r;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}

function drawUnit(u) {
  const isP = false;
  ctx.save();
  if (u.iframes > 0 && (frame >> 2) & 1) ctx.globalAlpha = 0.55;
  if (u.team === TEAM.HUMAN) drawHuman(u.x, u.y, u.r, u, false);
  else drawMonster(u.x, u.y, u.r, u, false);
  ctx.restore();
}

function drawPlayer() {
  const p = game.player;
  ctx.save();
  if (p.iframes > 0 && (frame >> 2) & 1) ctx.globalAlpha = 0.6;
  const fake = { bob: p.bob, step: p.step, aim: p.aim, seed: 3, eyes: 2 };
  if (p.team === TEAM.HUMAN) drawHuman(p.x, p.y, p.r, fake, true);
  else drawMonster(p.x, p.y, p.r, fake, true);
  ctx.restore();
  // aim reticle out in front
  const rx = p.x + Math.cos(p.aim) * 60, ry = p.y + Math.sin(p.aim) * 60;
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(rx, ry, 7, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx - 11, ry); ctx.lineTo(rx + 11, ry);
  ctx.moveTo(rx, ry - 11); ctx.lineTo(rx, ry + 11); ctx.stroke();
}

function drawBullets() {
  for (const b of game.bullets) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = b.color; ctx.lineWidth = b.r * 1.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 1.4, b.y - b.vy * 1.4); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, TAU); ctx.fill();
  }
}

function drawParticles() {
  for (const pt of game.particles) {
    const a = pt.life / pt.max;
    ctx.globalAlpha = a;
    if (pt.flash) {
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r * a, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  for (const f of game.floats) {
    ctx.globalAlpha = Math.min(1, f.life / 22);
    doodleText(f.text, f.x, f.y, 18, f.color, { stroke: "#000", strokeWidth: 4 });
  }
  ctx.globalAlpha = 1;
}

function drawWorldBorder() {
  // hazard-striped factory walls
  const W = CFG.WORLD_W, H = CFG.WORLD_H, t = 24;
  ctx.save();
  const stripe = (x, y, w, h, horiz) => {
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    for (let i = -h; i < w + h; i += 30) {
      ctx.fillStyle = ((i / 30) & 1) ? COLORS.hazard : "#1a1a1f";
      ctx.beginPath();
      if (horiz) { ctx.moveTo(x + i, y); ctx.lineTo(x + i + 15, y); ctx.lineTo(x + i + 15 + h, y + h); ctx.lineTo(x + i + h, y + h); }
      else { ctx.moveTo(x, y + i); ctx.lineTo(x, y + i + 15); ctx.lineTo(x + w, y + i + 15 + w); ctx.lineTo(x + w, y + i + w); }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  };
  stripe(0, 0, W, t, true);
  stripe(0, H - t, W, t, true);
  stripe(0, 0, t, H, false);
  stripe(W - t, 0, t, H, false);
  ctx.restore();
}

/* ----------------------------- HUD --------------------------------------- */
function drawHUD() {
  const { h, m } = census();
  const total = h + m;
  const barW = Math.min(VW - 40, 620), barH = 26;
  const bx = (VW - barW) / 2, by = 16;
  const hw = total > 0 ? (h / total) * barW : barW / 2;
  // background
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  roundRect(bx - 6, by - 6, barW + 12, barH + 12, 10); ctx.fill();
  // human side
  ctx.fillStyle = COLORS.human;
  roundRect(bx, by, Math.max(0, hw), barH, 6); ctx.fill();
  // monster side
  ctx.fillStyle = COLORS.monster;
  roundRect(bx + hw, by, Math.max(0, barW - hw), barH, 6); ctx.fill();
  // divider
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bx + hw, by - 3); ctx.lineTo(bx + hw, by + barH + 3); ctx.stroke();
  // labels
  doodleText("🦸 Rangers " + h, bx + 4, by + barH / 2, 16, "#06243f", { align: "left", shadow: false });
  doodleText(m + " Goonies 👹", bx + barW - 4, by + barH / 2, 16, "#0a2606", { align: "right", shadow: false });

  // which side are you on
  const youCol = game.player.team === TEAM.HUMAN ? COLORS.human : COLORS.monster;
  const youTxt = game.player.team === TEAM.HUMAN ? "You: RANGER 🦸" : "You: GOONIE 👹";
  doodleText(youTxt, VW / 2, by + barH + 22, 17, youCol, { stroke: "#000", strokeWidth: 4 });
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ----------------------------- Touch stick HUD --------------------------- */
function drawSticks() {
  if (!isTouch) return;
  for (const key of ["move", "aim"]) {
    const s = sticks[key];
    if (!s.active) continue;
    const v = stickVec(s);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath(); ctx.arc(s.ox, s.oy, STICK_MAX + 14, 0, TAU); ctx.fill();
    ctx.strokeStyle = key === "move" ? COLORS.human : COLORS.player;
    ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = key === "move" ? COLORS.human : COLORS.player;
    ctx.beginPath(); ctx.arc(s.ox + v.x, s.oy + v.y, 28, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ----------------------------- Screens ----------------------------------- */
function drawTitle() {
  // a calm factory backdrop
  ctx.fillStyle = "#1c1812"; ctx.fillRect(0, 0, VW, VH);
  // moving gears in the back
  for (let i = 0; i < 7; i++) {
    const gx = (i * 220 + frame * 0.3) % (VW + 200) - 100;
    const gy = 90 + (i % 3) * 130;
    ctx.globalAlpha = 0.12; drawGear(gx, gy, 60, frame * 0.01 * (i % 2 ? 1 : -1)); ctx.globalAlpha = 1;
  }
  const cx = VW / 2;
  doodleText("FACTORY", cx, VH * 0.26, Math.min(96, VW * 0.16), COLORS.hazard, { stroke: "#3a2a00", strokeWidth: 9 });
  doodleText("RANGERS", cx, VH * 0.26 + Math.min(92, VW * 0.155), Math.min(96, VW * 0.16), COLORS.human, { stroke: "#06243f", strokeWidth: 9 });

  // demo mascots
  const t = frame * 0.05;
  drawHuman(cx - 120, VH * 0.56 + Math.sin(t) * 6, 42, { bob: t, step: t, aim: 0.2, seed: 5, eyes: 2 }, true);
  drawMonster(cx + 120, VH * 0.56 + Math.sin(t + 1) * 6, 42, { bob: t + 1, step: t + 1, aim: Math.PI - 0.2, seed: 8, eyes: 3 }, false);

  doodleText("Two hordes battle for the factory!", cx, VH * 0.72, Math.min(24, VW * 0.05), "#ffe9a3", { stroke: "#000", strokeWidth: 4 });
  doodleText("Shoot the other side to flip them onto YOURS.", cx, VH * 0.72 + 32, Math.min(19, VW * 0.042), "#d8c08a", { shadow: false });
  doodleText("Wipe out a whole horde to win!", cx, VH * 0.72 + 60, Math.min(19, VW * 0.042), "#d8c08a", { shadow: false });

  const blink = (Math.sin(frame * 0.1) > -0.3);
  if (blink) doodleText(isTouch ? "👉 Tap to start" : "👉 Click to start", cx, VH * 0.88, Math.min(30, VW * 0.06), "#7bdf4a", { stroke: "#0a2606", strokeWidth: 5 });
}

function drawOver() {
  // dim the frozen battlefield
  ctx.fillStyle = "rgba(8,6,4,0.62)"; ctx.fillRect(0, 0, VW, VH);
  const cx = VW / 2;
  if (result && result.winner === TEAM.HUMAN) {
    // confetti
    for (const c of confetti) {
      c.x += c.vx; c.y += c.vy; c.rot += c.rotV;
      if (c.y > VH + 20) { c.y = -20; c.x = rand(0, VW); }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.fillStyle = c.color; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
    }
  }
  const col = result.winner === TEAM.HUMAN ? COLORS.human : COLORS.monster;
  doodleText(result.msg, cx, VH * 0.4, Math.min(64, VW * 0.11), col, { stroke: "#000", strokeWidth: 8 });
  doodleText(result.sub, cx, VH * 0.4 + 64, Math.min(22, VW * 0.045), "#ffe9a3", { stroke: "#000", strokeWidth: 4 });
  const blink = (Math.sin(frame * 0.1) > -0.3);
  if (blink) doodleText(isTouch ? "Tap to play again" : "Click to play again", cx, VH * 0.62, Math.min(28, VW * 0.055), "#7bdf4a", { stroke: "#0a2606", strokeWidth: 5 });
}

function drawPauseOverlay() {
  ctx.fillStyle = "rgba(8,6,4,0.6)"; ctx.fillRect(0, 0, VW, VH);
  doodleText("⏸ PAUSED", VW / 2, VH / 2 - 10, 52, COLORS.hazard, { stroke: "#000", strokeWidth: 7 });
  doodleText("Press P to resume", VW / 2, VH / 2 + 44, 22, "#d8c08a", { shadow: false });
}

/* ----------------------------- Render world ------------------------------ */
function renderWorld() {
  ctx.save();
  let sx = 0, sy = 0;
  if (screenShake > 0.4) { sx = rand(-screenShake, screenShake); sy = rand(-screenShake, screenShake); }
  ctx.translate(Math.round(VW / 2 - game.cam.x + sx), Math.round(VH / 2 - game.cam.y + sy));

  drawFloor();
  drawConveyors();
  drawWorldBorder();
  drawObstacles();
  drawBullets();

  // draw units sorted by y for a touch of depth (player included)
  const drawList = game.units.slice();
  for (const u of drawList) drawUnit(u);
  drawPlayer();

  drawParticles();
  drawFloats();
  ctx.restore();
}

/* ----------------------------- Main loop --------------------------------- */
function loop() {
  frame++;
  if (state === STATE.PLAY) updatePlay();
  else if (state === STATE.PAUSE) { if (consume("p")) state = STATE.PLAY; }

  // clear
  ctx.fillStyle = "#14110d";
  ctx.fillRect(0, 0, VW, VH);

  if (state === STATE.TITLE) {
    drawTitle();
    if (consume("Enter")) { startGame(); }
  } else {
    renderWorld();
    drawHUD();
    drawSticks();
    if (state === STATE.PAUSE) drawPauseOverlay();
    if (state === STATE.OVER) {
      drawOver();
      if (consume("Enter")) { startGame(); }
    }
  }

  requestAnimationFrame(loop);
}

// kick things off
clearPressed();
loop();
</script>
</body>
</html>
